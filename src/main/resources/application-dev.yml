spring:
  boot:
    admin:
      client:
        url: ${ADMIN_SERVER_URL:http://localhost:8081}
        instance:
          name: ${spring.application.name}-dev
          metadata:
            "[tags.environment]": dev

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    # Boot 4 disables heapdump by default (access: none); dev is the only env that opts in.
    heapdump:
      access: unrestricted

app:
  actuator:
    http-exchanges:
      enabled: true
